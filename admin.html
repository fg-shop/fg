<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SorveX Mail | Admin Panel</title>
  <meta name="description" content="SorveX Mail admin panel - manage products securely." />

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    body {
      background-color: #f1f5f9;
      color: #0f172a;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .heading-font { font-family: 'Outfit', sans-serif; }
  </style>
</head>
<body class="antialiased selection:bg-indigo-500 selection:text-white min-h-screen">

  <!-- Ambient glow -->
  <div class="fixed top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
    <div class="absolute -top-32 -right-32 w-[30rem] h-[30rem] bg-indigo-500/10 rounded-full blur-[120px]"></div>
    <div class="absolute top-1/2 -left-32 w-[25rem] h-[25rem] bg-purple-500/10 rounded-full blur-[100px]"></div>
  </div>

  <div class="max-w-4xl mx-auto px-4 sm:px-6 py-6 sm:py-10">

    <!-- Top bar -->
    <div class="flex items-center justify-between mb-6">
      <a href="index.html" class="flex items-center gap-2.5 group">
        <span class="w-9 h-9 rounded-xl bg-gradient-to-br from-indigo-600 to-purple-600 flex items-center justify-center text-white font-black heading-font shadow group-hover:scale-105 transition-transform">S</span>
        <div>
          <p class="heading-font font-black text-slate-900 leading-tight">SorveX Mail</p>
          <p class="text-[11px] text-slate-400 font-semibold" id="admin-status">Not signed in</p>
        </div>
      </a>
      <a href="index.html" class="text-xs font-bold text-slate-600 bg-white border border-slate-200 hover:bg-slate-100 px-3.5 py-2 rounded-full transition-colors">&larr; View Store</a>
    </div>

    <!-- Config warning -->
    <div id="config-warning" class="hidden mb-6 p-4 rounded-2xl bg-amber-50 border border-amber-200 text-amber-800 text-xs font-semibold leading-relaxed">
      Firebase config এখনো যোগ করা হয়নি। admin.html-এর নিচে <code class="bg-amber-100 px-1 rounded">firebaseConfig</code> object-এ তোমার Firebase config paste করো। ততক্ষণ admin edit disabled থাকবে।
    </div>

    <!-- LOGIN VIEW -->
    <div id="admin-login" class="hidden">
      <div class="max-w-sm mx-auto bg-white rounded-3xl shadow-xl border border-slate-200 p-7 sm:p-8 mt-6">
        <h1 class="heading-font font-black text-2xl text-slate-900 mb-1">Admin Login</h1>
        <p class="text-slate-400 text-sm font-medium mb-6">Sign in to manage products.</p>
        <form id="login-form" class="space-y-4">
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1.5">Email</label>
            <input type="email" id="login-email" required class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500/40 focus:border-indigo-400" placeholder="admin@example.com" />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1.5">Password</label>
            <input type="password" id="login-password" required class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500/40 focus:border-indigo-400" placeholder="••••••••" />
          </div>
          <p id="login-error" class="hidden text-xs font-semibold text-rose-500"></p>
          <button type="submit" class="w-full bg-slate-900 hover:bg-indigo-600 text-white font-bold py-3 rounded-xl transition-colors active:scale-[0.99]">Sign In</button>
        </form>
      </div>
    </div>

    <!-- DASHBOARD VIEW -->
    <div id="admin-dashboard" class="hidden space-y-6">

      <div class="flex items-center justify-between gap-3">
        <button id="seed-btn" class="text-xs font-bold text-slate-600 bg-white border border-slate-200 hover:bg-slate-100 px-3 py-2 rounded-full transition-colors">Import demo products</button>
        <button id="logout-btn" class="text-xs font-bold text-rose-500 hover:text-rose-600 px-3 py-2 transition-colors">Sign Out</button>
      </div>

      <!-- Product form -->
      <form id="product-form" class="bg-white rounded-2xl border border-slate-200 p-5 space-y-4">
        <div class="flex items-center justify-between">
          <h4 class="heading-font font-black text-slate-900" id="form-title">Add New Product</h4>
          <button type="button" id="form-reset" class="hidden text-xs font-bold text-slate-400 hover:text-slate-600">Cancel edit</button>
        </div>
        <input type="hidden" id="p-id" />
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="sm:col-span-2">
            <label class="block text-xs font-bold text-slate-600 mb-1.5">Product Name</label>
            <input type="text" id="p-name" required class="w-full rounded-xl border border-slate-200 px-4 py-2.5 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500/40" />
          </div>
          <div class="sm:col-span-2">
            <label class="block text-xs font-bold text-slate-600 mb-1.5">Category</label>
            <select id="p-cat" required class="w-full rounded-xl border border-slate-200 px-4 py-2.5 text-sm font-medium bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500/40"></select>
          </div>
          <div class="sm:col-span-2">
            <label class="block text-xs font-bold text-slate-600 mb-1.5">Description</label>
            <textarea id="p-desc" rows="2" class="w-full rounded-xl border border-slate-200 px-4 py-2.5 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500/40"></textarea>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1.5">Price (USDT)</label>
            <input type="number" step="0.01" min="0" id="p-usdt" required class="w-full rounded-xl border border-slate-200 px-4 py-2.5 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500/40" />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1.5">Price (BDT)</label>
            <input type="number" step="1" min="0" id="p-bdt" required class="w-full rounded-xl border border-slate-200 px-4 py-2.5 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500/40" />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1.5">Stock</label>
            <input type="number" step="1" min="0" id="p-stock" required class="w-full rounded-xl border border-slate-200 px-4 py-2.5 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500/40" />
          </div>
        </div>
        <button type="submit" id="form-submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl transition-colors active:scale-[0.99]">Save Product</button>
      </form>

      <!-- Product list -->
      <div>
        <h4 class="heading-font font-black text-slate-900 mb-3">All Products (<span id="admin-count">0</span>)</h4>
        <div id="admin-product-list" class="space-y-2"></div>
      </div>

    </div>
  </div>

  <!-- =========================== ADMIN LOGIC =========================== -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import {
      getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc,
      doc, getDocs, writeBatch
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import {
      getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    /* ============================================================
       🔥 তোমার Firebase project-এর config এখানে আছে।
       ============================================================ */
    const firebaseConfig = {
      apiKey: "AIzaSyDweHVCuxeRVmfrl9EDmdgMeYURYc8qShY",
      authDomain: "fg-shop-850a4.firebaseapp.com",
      projectId: "fg-shop-850a4",
      storageBucket: "fg-shop-850a4.firebasestorage.app",
      messagingSenderId: "817663444891",
      appId: "1:817663444891:web:598378c52c2c28e75c433e",
      measurementId: "G-YB4QSW14YC"
    };

    // ---- Categories + seed data ----
    const categories = [
      { id: "cat-29", title: "Microsoft Hotmail & Outlook", badge: "POPULAR", icon: "M" },
      { id: "cat-46", title: "Outlook Domain / Different Type Domain", badge: null, icon: "O" },
      { id: "cat-43", title: "VPN Of Different Type", badge: null, icon: "V" },
      { id: "cat-48", title: "Proxy Of 1 GB And 10 GB", badge: "HOT", icon: "P" },
      { id: "cat-49", title: "Gmail Edu Mail 0-1 Days", badge: null, icon: "G" },
      { id: "cat-50", title: "Gmail Edu Mail 1 Days", badge: null, icon: "G" },
      { id: "cat-51", title: "Edu Mail Of 3 And 7 Days", badge: null, icon: "E" },
      { id: "cat-52", title: "Edu Mail Of 15 And 30 Days", badge: null, icon: "E" }
    ];

    const seedProducts = [
      { cat: "cat-29", name: "Hotmail Fresh Account", desc: "Freshly created, verified Hotmail account.", usdt: 0.35, bdt: 40, stock: 1240 },
      { cat: "cat-29", name: "Outlook Aged Account", desc: "Aged Outlook account with high trust score.", usdt: 0.8, bdt: 92, stock: 560 },
      { cat: "cat-46", name: "Custom Domain Outlook", desc: "Outlook on your own custom domain.", usdt: 1.5, bdt: 172, stock: 210 },
      { cat: "cat-43", name: "Premium VPN - 1 Month", desc: "High speed VPN, multiple locations.", usdt: 2.5, bdt: 285, stock: 430 },
      { cat: "cat-48", name: "Residential Proxy 1 GB", desc: "Rotating residential proxy, 1 GB data.", usdt: 1.2, bdt: 138, stock: 890 },
      { cat: "cat-48", name: "Residential Proxy 10 GB", desc: "Rotating residential proxy, 10 GB data.", usdt: 9.5, bdt: 1090, stock: 320 },
      { cat: "cat-49", name: "Gmail Edu Mail 0-1 Days", desc: "Fresh edu Gmail, 0-1 days old.", usdt: 3.0, bdt: 345, stock: 150 },
      { cat: "cat-50", name: "Gmail Edu Mail 1 Day", desc: "Edu Gmail, exactly 1 day aged.", usdt: 3.2, bdt: 368, stock: 120 },
      { cat: "cat-51", name: "Edu Mail 3-7 Days", desc: "Edu mail aged 3 to 7 days.", usdt: 4.5, bdt: 517, stock: 80 },
      { cat: "cat-52", name: "Edu Mail 15-30 Days", desc: "Premium aged edu mail, 15-30 days.", usdt: 7.0, bdt: 805, stock: 45 }
    ];

    // ---- Firebase init ----
    let db = null, auth = null, firebaseReady = false;
    const configPlaceholder = firebaseConfig.apiKey.indexOf("PASTE_") === 0;
    if (!configPlaceholder) {
      try {
        const app = initializeApp(firebaseConfig);
        db = getFirestore(app);
        auth = getAuth(app);
        firebaseReady = true;
      } catch (e) {
        console.log("[v0] Firebase init failed:", e.message);
      }
    }

    let products = [];

    function escapeHtml(str) {
      return String(str == null ? "" : str)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }

    function catTitle(id) {
      const c = categories.filter(function (x) { return x.id === id; })[0];
      return c ? c.title : id;
    }

    const loginView = document.getElementById("admin-login");
    const dashView = document.getElementById("admin-dashboard");
    const statusEl = document.getElementById("admin-status");

    document.getElementById("config-warning").classList.toggle("hidden", firebaseReady);

    // populate category select
    (function fillCategorySelect() {
      const sel = document.getElementById("p-cat");
      sel.innerHTML = categories.map(function (c) {
        return '<option value="' + c.id + '">' + escapeHtml(c.title) + '</option>';
      }).join("");
    })();

    // ---- Auth ----
    if (firebaseReady) {
      onAuthStateChanged(auth, function (user) {
        if (user) {
          loginView.classList.add("hidden");
          dashView.classList.remove("hidden");
          statusEl.textContent = "Signed in as " + user.email;
          startProducts();
        } else {
          loginView.classList.remove("hidden");
          dashView.classList.add("hidden");
          statusEl.textContent = "Not signed in";
        }
      });
    } else {
      loginView.classList.remove("hidden");
      statusEl.textContent = "Firebase config missing";
    }

    document.getElementById("login-form").addEventListener("submit", function (e) {
      e.preventDefault();
      const err = document.getElementById("login-error");
      err.classList.add("hidden");
      if (!firebaseReady) { err.textContent = "Firebase config যোগ করা হয়নি।"; err.classList.remove("hidden"); return; }
      const email = document.getElementById("login-email").value.trim();
      const pass = document.getElementById("login-password").value;
      signInWithEmailAndPassword(auth, email, pass).catch(function (e2) {
        err.textContent = "Login failed: " + e2.code;
        err.classList.remove("hidden");
      });
    });

    document.getElementById("logout-btn").addEventListener("click", function () {
      if (firebaseReady) signOut(auth);
    });

    // ---- Live products ----
    let subscribed = false;
    function startProducts() {
      if (!firebaseReady || subscribed) return;
      subscribed = true;
      onSnapshot(collection(db, "products"), function (snap) {
        products = snap.docs.map(function (d) {
          const data = d.data();
          return {
            id: d.id, cat: data.cat, name: data.name, desc: data.desc || "",
            usdt: Number(data.usdt) || 0, bdt: Number(data.bdt) || 0, stock: Number(data.stock) || 0
          };
        });
        products.sort(function (a, b) { return a.name.localeCompare(b.name); });
        renderAdminList();
      }, function (err) {
        console.log("[v0] Firestore read failed:", err.message);
      });
    }

    // ---- Product form (add / edit) ----
    const form = document.getElementById("product-form");
    const formTitle = document.getElementById("form-title");
    const formReset = document.getElementById("form-reset");

    function resetForm() {
      form.reset();
      document.getElementById("p-id").value = "";
      formTitle.textContent = "Add New Product";
      formReset.classList.add("hidden");
    }
    formReset.addEventListener("click", resetForm);

    form.addEventListener("submit", async function (e) {
      e.preventDefault();
      if (!firebaseReady) { alert("Firebase config যোগ করলে তবেই product save হবে।"); return; }
      const id = document.getElementById("p-id").value;
      const payload = {
        cat: document.getElementById("p-cat").value,
        name: document.getElementById("p-name").value.trim(),
        desc: document.getElementById("p-desc").value.trim(),
        usdt: Number(document.getElementById("p-usdt").value),
        bdt: Number(document.getElementById("p-bdt").value),
        stock: Number(document.getElementById("p-stock").value)
      };
      try {
        if (id) {
          await updateDoc(doc(db, "products", id), payload);
        } else {
          await addDoc(collection(db, "products"), payload);
        }
        resetForm();
      } catch (e2) {
        alert("Save failed: " + e2.message);
      }
    });

    // ---- Admin product list ----
    function renderAdminList() {
      const list = document.getElementById("admin-product-list");
      const countEl = document.getElementById("admin-count");
      if (countEl) countEl.textContent = products.length;
      if (!list) return;
      if (!products.length) {
        list.innerHTML = '<p class="text-sm text-slate-400 font-semibold py-4 text-center">No products yet.</p>';
        return;
      }
      list.innerHTML = products.map(function (p) {
        return '' +
          '<div class="flex items-center gap-3 bg-white border border-slate-200 rounded-xl px-4 py-3">' +
            '<div class="flex-1 min-w-0">' +
              '<p class="font-bold text-slate-900 text-sm truncate">' + escapeHtml(p.name) + '</p>' +
              '<p class="text-[11px] text-slate-400 font-semibold truncate">' + escapeHtml(catTitle(p.cat)) + ' · $' + Number(p.usdt).toFixed(2) + ' / \u09F3' + Number(p.bdt) + ' · ' + escapeHtml(p.stock) + ' stock</p>' +
            '</div>' +
            '<button data-edit="' + p.id + '" class="text-xs font-bold text-indigo-600 hover:text-indigo-700 px-2 py-1">Edit</button>' +
            '<button data-del="' + p.id + '" class="text-xs font-bold text-rose-500 hover:text-rose-600 px-2 py-1">Delete</button>' +
          '</div>';
      }).join("");
    }

    document.getElementById("admin-product-list").addEventListener("click", async function (e) {
      const editId = e.target.getAttribute && e.target.getAttribute("data-edit");
      const delId = e.target.getAttribute && e.target.getAttribute("data-del");

      if (editId) {
        const p = products.filter(function (x) { return x.id === editId; })[0];
        if (!p) return;
        document.getElementById("p-id").value = p.id;
        document.getElementById("p-cat").value = p.cat;
        document.getElementById("p-name").value = p.name;
        document.getElementById("p-desc").value = p.desc;
        document.getElementById("p-usdt").value = p.usdt;
        document.getElementById("p-bdt").value = p.bdt;
        document.getElementById("p-stock").value = p.stock;
        formTitle.textContent = "Edit Product";
        formReset.classList.remove("hidden");
        form.scrollIntoView({ behavior: "smooth", block: "start" });
        return;
      }

      if (delId) {
        if (!firebaseReady) { alert("Firebase config যোগ করলে তবেই delete হবে।"); return; }
        if (!confirm("এই product-টি delete করবে?")) return;
        try { await deleteDoc(doc(db, "products", delId)); }
        catch (e2) { alert("Delete failed: " + e2.message); }
      }
    });

    // ---- Import demo products ----
    document.getElementById("seed-btn").addEventListener("click", async function () {
      if (!firebaseReady) { alert("Firebase config যোগ করলে তবেই import হবে।"); return; }
      if (!confirm(seedProducts.length + " টি demo product Firestore-এ যোগ করবে?")) return;
      try {
        const existing = await getDocs(collection(db, "products"));
        const batch = writeBatch(db);
        seedProducts.forEach(function (p) {
          const ref = doc(collection(db, "products"));
          batch.set(ref, p);
        });
        await batch.commit();
        alert("Demo products imported. মোট এখন: " + (existing.size + seedProducts.length));
      } catch (e2) {
        alert("Import failed: " + e2.message);
      }
    });
  </script>
</body>
</html>
